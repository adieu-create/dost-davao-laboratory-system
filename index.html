<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DOST Laboratory Quotation & Reservation System</title>
<style>
:root{color-scheme:light dark;--blue:#0057a8;--blue2:#0b76d1;--navy:#073763;--ink:#111827;--muted:#64748b;--line:#d7dee8;--bg:#f4f7fb;--surface:#fff;--soft:#eaf3ff;--danger:#b42318;--ok:#087443}
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--ink)}
#app{min-height:100vh;background:var(--bg)}
header{background:linear-gradient(135deg,var(--navy),var(--blue));color:#fff;padding:22px 28px;box-shadow:0 3px 12px #0002}.brand{max-width:1200px;margin:auto;display:flex;align-items:center;gap:16px}.seal{width:58px;height:58px;border:2px solid #fff;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:12px;text-align:center}.brand h1{font-size:21px;margin:0}.brand p{margin:4px 0 0;opacity:.86;font-size:13px}
main{max-width:1200px;margin:0 auto;padding:28px 20px 50px}.crumb{color:var(--muted);font-size:13px;margin-bottom:16px}.hero{margin-bottom:24px}.hero h2{margin:0 0 7px;font-size:30px}.hero p{margin:0;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px;box-shadow:0 4px 15px #173b5d0b;cursor:pointer;transition:.18s}.card:hover{transform:translateY(-2px);border-color:#8bbce9;box-shadow:0 8px 24px #173b5d18}.card .num{font-size:12px;color:var(--blue);font-weight:800}.card h3{margin:8px 0 7px;font-size:18px}.card p{margin:0;color:var(--muted);font-size:13px;line-height:1.45}.badge{display:inline-block;margin-top:14px;background:var(--soft);color:var(--blue);padding:5px 8px;border-radius:99px;font-size:11px;font-weight:700}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:24px;box-shadow:0 4px 15px #173b5d0b}.actions{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin-top:18px}.action{padding:24px;border:1px solid var(--line);border-radius:12px;background:var(--surface);cursor:pointer;text-align:left}.action:hover{border-color:var(--blue);background:var(--soft)}.action strong{display:block;font-size:17px;margin-bottom:7px}.action span{font-size:13px;color:var(--muted)}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:18px}.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:10px 15px;cursor:pointer;font-weight:700}.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}.btn.secondary{background:var(--soft);border-color:#b8d9f7;color:var(--blue)}.btn.danger{color:var(--danger)}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}.field{display:flex;flex-direction:column;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:12px;font-weight:800}.field input,.field select,.field textarea{width:100%;padding:10px 11px;border:1px solid var(--line);border-radius:7px;background:var(--surface);color:var(--ink);font:inherit}.field textarea{min-height:80px;resize:vertical}.section-title{margin:24px 0 12px;font-size:15px;color:var(--navy);border-bottom:2px solid var(--soft);padding-bottom:7px}
.items{border:1px solid var(--line);border-radius:10px;overflow:auto}.items table{width:100%;border-collapse:collapse;min-width:800px}.items th,.items td{padding:9px;border-bottom:1px solid var(--line);font-size:12px;text-align:left;vertical-align:top}.items th{background:var(--soft);color:var(--navy)}.items input,.items select{padding:7px;width:100%;border:1px solid var(--line);border-radius:5px;background:var(--surface);color:var(--ink)}.total{text-align:right;font-size:18px;font-weight:800;margin-top:14px}.notice{padding:11px 13px;background:#fff8e1;border-left:4px solid #d9a400;border-radius:5px;font-size:12px;color:#684f00;margin:15px 0}.searchbar{display:flex;gap:10px}.searchbar input{flex:1;padding:11px;border:1px solid var(--line);border-radius:7px;background:var(--surface);color:var(--ink)}
#modal{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;padding:20px;z-index:20}.modalbox{background:var(--surface);color:var(--ink);width:min(950px,100%);max-height:90vh;overflow:auto;border-radius:12px;padding:22px}.close{float:right}.print-doc{background:#fff;color:#111;padding:34px;max-width:900px;margin:auto;font-family:Arial,sans-serif}.print-doc h1{text-align:center;font-size:19px;margin:0}.print-doc .sub{text-align:center;font-size:12px;margin-bottom:20px}.doc-title{text-align:center;letter-spacing:6px;font-size:18px;font-weight:800;margin:18px 0}.doc-table{width:100%;border-collapse:collapse;font-size:11px}.doc-table th,.doc-table td{border:1px solid #222;padding:6px;vertical-align:top}.doc-table th{background:#eee}.doc-total{text-align:right;font-weight:800;margin-top:8px}.doc-small{font-size:10px;line-height:1.35}.doc-sign{display:grid;grid-template-columns:1fr 1fr;gap:30px;margin-top:28px}.doc-line{border-bottom:1px solid #222;min-height:24px}.hidden{display:none}
@media(max-width:700px){.form-grid{grid-template-columns:1fr}.hero h2{font-size:25px}.brand{align-items:flex-start}.brand h1{font-size:17px}}
@media print{body{background:#fff}.no-print{display:none!important}#modal{position:static;display:block;background:#fff;padding:0}.modalbox{max-height:none;box-shadow:none;padding:0}.print-doc{padding:10mm;max-width:none}}
</style></head>
<body><div id="app"></div><div id="modal"><div class="modalbox"><button class="btn close no-print" onclick="closeModal()">Close</button><div id="modalContent"></div></div></div>

itation, Monitoring and Inspection','Aerobic Plate Count (Pour Plate Method)',550],['Plant Sanitation, Monitoring and Inspection','Aerobic Plate Count (Rapid Method)',700],['Plant Sanitation, Monitoring and Inspection','Staphylococcus aureus Count Swab (Rapid Method)',800],['Plant Sanitation, Monitoring and Inspection','Salmonella spp. Detection (Rapid Method)',1000],['Plant Sanitation, Monitoring and Inspection','Coliform & Escherichia coli Count Swab (Rapid Method)',1600],['Plant Sanitation, Monitoring and Inspection','Yeast and Mold Count (Pour Plate Method)',550],['Plant Sanitation, Monitoring and Inspection','Yeast and Mold Count (Rapid Method)',800],['Air Microbial Load','Yeast & Mold Count',550],['Air Microbial Load','Aerobic Plate Count',550]],
Chemistry:[['Food Products','Ash Content (Gravimetric Method)',550],['Food Products','Basic Nutritional Facts',6750],['Food Products','Crude Fat (Soxtec/Soxhlet Extraction)',1200],['Food Products','Crude Protein (Kjeldahl Method)',1000],['Food Products','Free Fatty Acids (Titrimetric)',500],['Food Products','Moisture Content (Gravimetric Method)',400],['Food Products','Calcium (AAS)',1920],['Food Products','Iron (AAS)',1920],['Food Products','Sodium (AAS)',1920],['Food Products','Potassium (AAS)',1920],['Food Products','Copper (AAS)',1920],['Food Products','Magnesium (AAS)',1920],['Food Products','Nitrogen (Kjeldahl Method)',1000],['Food Products','Nutritional Facts (Computation & Drafting of Nutritional Facts)',1500],['Food Products','Nutritional Facts (Computation of Carbohydrates & Energy)',180],['Food Products','pH (pH meter)',325],['Food Products','Total Titratable Acidity (Titrimetric Method)',560],['Food Products','Total Soluble Solids (refractometer)',360],['Food Products','Total Solids (Gravimetric)',400],['Food Products','Water Activity',375],['Water','Copper (AAS)',1200],['Water','Iron (AAS)',1200],['Water','Calcium (AAS)',1200],['Water','Sodium (AAS)',1200],['Water','Potassium (AAS)',1200],['Water','Magnesium (AAS)',1200],['Water','Hardness/Total Hardness as Calcium Carbonate (Including Magnesium)',2400],['Water','pH',350],['Water','Total Dissolved Solids (TDS/Gravimetric)',600],['Water','Total Suspended Solids (Gravimetric)',650],['Water','Total Solids',1250],['Water','Turbidity',300],['Water','Salinity',300]],

ShelfLife:[['Food/Beverage Products','Shelf Life Testing (Direct Method)',11000],['Food/Beverage Products','Shelf Life Testing (Temperature Accelerated Method)',20000]],
Metrology:[['Length','Caliper — Up to 200 mm',950],['Length','Caliper — 201 to 300 mm',1225],['Length','Caliper — 301 to 600 mm',1400],['Length','External Micrometer — up to 25 mm',700],['Length','External Micrometer — 26 to 100 mm',800],['Length','External Micrometer — 101 to 150 mm',1000],['Length','External Micrometer — 151 to 200 mm',1250],['Length','External Micrometer — 201 to 250 mm',1600],['Length','External Micrometer — 251 to 300 mm',1800],['Length','Depth Micrometer — 0 to 25 mm',750],['Length','Steel Rule — up to 600 mm',850],['Length','Steel Rule — 601 to 2000 mm',900],['Length','Dimensional Measurement — Free nominal',500],['Length','Tape Measure — up to 10 m',700],['Thermometry','Digital Thermometer (5 Test Points) — -30 to 600 °C',1700],['Thermometry','Dial Thermometer (5 Test Points) — -30 to 600 °C',1700],['Thermometry','Digital Thermometer (two Probes) — -30 to 600 °C',1800],['Thermometry','LIG Thermometer (5 Test Points) — -30 to 200 °C',1700],['Thermometry','Furnace/Ovens/Enclosures/cold storage/water bath — -30 to 300 °C',2100],['Thermometry','Thermohygrometer — 0 to 100 °C, 0 to 100 %RH',1550],['Thermometry','Hygrometer — 0 to 100 %RH',700],['Mass','Test Weights OIML Class F1 (stainless steel) — 1 g to 10 kg',600],['Mass','Test Weights OIML Class F2 (stainless steel) — 1 mg to 10 kg',600],['Mass','Test Weights OIML Class F2 (stainless steel) — 20 kg',800],['Mass','Test Weights OIML Class F2 (stainless steel) — 25 kg to 50 kg',1000],['Mass','Test Weights Class M (chrome, brass, cast iron) — 1 mg to 500 g',450],['Mass','Test Weights Class M (chrome, brass, cast iron) — 1 kg to 10 kg',600],['Mass','Test Weights Class M (chrome, brass, cast iron) — 20 kg to 50 kg',700],['Mass','Test Weights Class M (chrome, brass, cast iron) — >50 kg',1500],['Mass','Balance — Digital, below 1 tonne',1530],['Mass','Balance — Digital, 1 tonne and above',2000],['Mass','Balance — Nondigital, below 1 tonne',1200],['Mass','Balance — Nondigital, 1 tonne and above',2000],['Mass','Truck Scale / Crane Scale / Batch Weigher — up to 100 tonne',2000],['Small Volume','Measuring Pipette',600],['Small Volume','Volumetric Pipette',600],['Small Volume','Volumetric Flask',600],['Small Volume','Graduated Cylinder',600],['Small Volume','Burette',1500],['Small Volume','Pipettor',1500],['Small Volume','Beaker',600],['Small Volume','Erlenmeyer Flask',600],['Small Volume','Test Measure (gravimetric) — up to 10 L',1800],['Small Volume','Test Measure (gravimetric) — >10 L to 20 L',2000],['Big Volume','Test Measure (volumetric) — up to 10 L',500],['Big Volume','Test Measure (volumetric) — >10 L to 20 L',600],['Big Volume','Tank Truck — 5 KL and below',1000],['Big Volume','Tank Truck — 6 KL to 10 KL',1500],['Big Volume','Tank Truck — 12 KL to 14 KL',2000],['Big Volume','Tank Truck — 16 KL to 20 KL',2500],['Big Volume','Tank Truck — 22 KL to 24 KL',3000],['Big Volume','Tank Truck — 26 KL to 30 KL',3500],['Big Volume','Tank Truck — 32 KL to 34 KL',4000],['Big Volume','Tank Truck — 36 KL to 40 KL',4500],['Big Volume','Tank Truck — 42 KL to 44 KL',5000],['Big Volume','Tank Truck — 46 KL and above',5500],['Big Volume','Proving Tank — 30 L to 400 L',1500],['Big Volume','Proving Tank — 401 L to 2000 L',3000],['Big Volume','Proving Tank — 2001 L to 5000 L',4500],['Big Volume','Storage Tank — 5000 L and above',4500],['Pressure','Pneumatic Pressure Gauge — up to 3000 psi',900],['Thermal Validation','Heat Distribution per product',10000],['Thermal Validation','Heat Penetration per product',10000],['Other','Issuance of Formula of Conversion (FOC)',1000],['Other','Issuance of Succeeding Pages of FOC',500],['Other','Re-issuance of Copy of Report of Analysis and/or Calibration Certificate',100],['Other','Request for Certificate of Quality',100],['Other','Use of Equipment',100],['Other','On-site Calibration Charge (50 km radius)',2000],['Other','On-site Calibration Charge (more than 50 km radius)',3000],['Other','Additional Test Point (Proving Tank)',500],['Other','Additional Test Point (Ovens)',500],['Other','Additional Test Point (Thermometer)',400],['Other','Additional Test Point (Small Volume)',400],['Other','Additional Fee (Steel Tape), in excess of 10m',100]]
};
const LABS={RML:{name:'Regional Metrology Laboratory',code:'RML',quotation:true,reservation:true},Microbiology:{name:'Microbiology Laboratory',code:'MICRO',quotation:true,reservation:false},Chemistry:{name:'Chemistry Laboratory',code:'CHEM',quotation:true,reservation:false},ShelfLife:{name:'Shelf Life Laboratory',code:'SHELF',quotation:true,reservation:false},Halal:{name:'Halal Verification Laboratory',code:'HALAL',quotation:true,reservation:false}};
let state={lab:null,mode:null};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const peso=n=>'₱'+Number(n||0).toLocaleString('en-PH',{minimumFractionDigits:2,maximumFractionDigits:2});
function header(){return `<header><div class="brand"><div class="seal">DOST<br>Davao Region</div><div><h1>DOST Laboratory Quotation & Reservation System</h1><p>DOST - Davao Region</p></div></div></header>`}
function render(){const app=document.getElementById('app');app.innerHTML=header()+`<main id="main"></main>`;home()}
function home(){state={lab:null,mode:null};document.getElementById('main').innerHTML=`<div class="hero"><div class="crumb">Main Menu</div><h2>Laboratory Services</h2><p>Select a laboratory to access its quotation or reservation workflow.</p></div><div class="grid">${Object.entries(LABS).map(([k,l],i)=>`<div class="card" onclick="selectLab('${k}')"><div class="num">LABORATORY ${i+1}</div><h3>${l.name}</h3><p>${l.reservation?'Quotation and reservation services available.':'Quotation services available.'}</p><span class="badge">${l.reservation?'Quotation + Reservation':'Quotation only'}</span></div>`).join('')}</div>`}
function selectLab(k){state.lab=k;const l=LABS[k];document.getElementById('main').innerHTML=`<div class="crumb"><button class="btn" onclick="home()">← Main Menu</button> / ${l.name}</div><div class="hero"><h2>${l.name}</h2>${l.quotation||l.reservation?`<p>Select the transaction type.</p>`:`<p>This laboratory directory is reserved for future modules.</p>`}</div>${l.quotation||l.reservation?`<div class="actions">${l.quotation?`<button class="action" onclick="chooseExisting('quotation')"><strong>Quotation</strong><span>Create a new quotation or search previously generated quotations.</span></button>`:''}${l.reservation?`<button class="action" onclick="chooseExisting('reservation')"><strong>Reservation</strong><span>Create a new reservation or search previously generated reservations.</span></button>`:''}</div>`:`<div class="panel"><div class="notice">Quotation and reservation workflows are not currently enabled for this laboratory.</div></div>`}`}
function chooseExisting(mode){state.mode=mode;document.getElementById('main').innerHTML=`<div class="crumb"><button class="btn" onclick="selectLab('${state.lab}')">← ${LABS[state.lab].name}</button></div><div class="hero"><h2>${mode==='quotation'?'Quotation':'Reservation'}</h2><p>Choose how you want to proceed.</p></div><div class="actions"><button class="action" onclick="newRecord()"><strong>＋ Create New</strong><span>Enter the required details and generate the official form.</span></button><button class="action" onclick="searchRecords()"><strong>⌕ Search Existing</strong><span>Find records previously saved in this browser.</span></button></div>`}
function newRecord(){state.mode==='quotation'?quotationForm():reservationForm()}
function field(label,name,type='text',extra=''){return `<div class="field"><label>${label}</label><input type="${type}" name="${name}" ${extra}></div>`}
function quotationForm(){const halal=state.lab==='Halal';document.getElementById('main').innerHTML=`<div class="toolbar"><button class="btn" onclick="chooseExisting('quotation')">← Back</button><button class="btn secondary" onclick="addItem()">＋ Add Service</button></div><div class="panel"><h2>${halal?'Halal Laboratory Quotation':'Laboratory Quotation'}</h2><div class="notice">Prices are loaded from the current prototype service schedule. Service descriptions and fees can be edited later without changing the form layout.</div><form id="quoteForm"><div class="section-title">Client Information</div><div class="form-grid">${field('Quotation Date','date','date','required')}${field('Name of Company','company','text','required')}${field('Address','address','text','required')}${field('Contact No.','contact','text')}${field('Email Address','email','email')}${field('Addressee / Designation','addressee','text')}</div><div class="section-title">Quotation Details</div><div class="items"><table><thead><tr><th>No.</th><th>Item / Sample Description</th><th>Test / Service</th><th>Requirement / Method</th><th>Unit Fee</th><th>Qty</th><th>Total</th><th></th></tr></thead><tbody id="itemsBody"></tbody></table></div><div class="total">GRAND TOTAL: <span id="grandTotal">₱0.00</span></div><div class="section-title">Service Information and Requirements</div><div class="form-grid">${field('Estimated Turnaround Time (working days)','tat')}${field('Sample Submission Schedule','schedule')}${field('Sample Requirement','sampleReq')}${field('Payment Terms / Instructions','payment')}</div>${halal?`<div class="section-title">Validity</div><div class="notice">This quotation is valid five (5) working days upon receipt.</div>`:`<div class="section-title">Terms and Conditions</div><div class="notice">The requesting party shall provide complete and accurate information, submit compliant samples/items, secure and observe the confirmed sample submission schedule, review and confirm the Request Form details, and settle applicable fees as required by the laboratory.</div>`}<div class="toolbar" style="margin-top:20px"><button type="button" class="btn primary" onclick="generateQuotation()">Generate Quotation</button></div></form></div>`;addItem()}
function optionsForLab(){return PRICE_DATA[state.lab==='RML'?'Metrology':state.lab]||[]}
function addItem(){const b=document.getElementById('itemsBody');if(!b)return;const n=b.children.length+1;const opts=optionsForLab().map((x,i)=>`<option value="${i}">${esc(x[1])} — ${peso(x[2])}</option>`).join('');const tr=document.createElement('tr');tr.innerHTML=`<td>${n}</td><td><input class="itemdesc" placeholder="Sample / item"></td><td><select class="service" onchange="recalc()"><option value="">Select service</option>${opts}</select></td><td><input class="req" placeholder="Requirement / method"></td><td class="fee">₱0.00</td><td><input class="qty" type="number" min="1" value="1" onchange="recalc()"></td><td class="amt">₱0.00</td><td><button type="button" class="btn danger" onclick="this.closest('tr').remove();renumber();recalc()">×</button></td>`;b.appendChild(tr);recalc()}
function renumber(){document.querySelectorAll('#itemsBody tr').forEach((tr,i)=>tr.children[0].textContent=i+1)}
function recalc(){let total=0;document.querySelectorAll('#itemsBody tr').forEach(tr=>{const s=tr.querySelector('.service'),q=Number(tr.querySelector('.qty').value||1),d=optionsForLab()[Number(s.value)];const fee=d?d[2]:0;const amt=fee*q;tr.querySelector('.fee').textContent=peso(fee);tr.querySelector('.amt').textContent=peso(amt);total+=amt});const g=document.getElementById('grandTotal');if(g)g.textContent=peso(total)}
function generateQuotation(){const f=document.getElementById('quoteForm');if(!f.reportValidity())return;const fd=new FormData(f),items=[...document.querySelectorAll('#itemsBody tr')].map(tr=>{const d=optionsForLab()[Number(tr.querySelector('.service').value)];return{description:tr.querySelector('.itemdesc').value,service:d?d[1]:'',requirement:tr.querySelector('.req').value,fee:d?d[2]:0,qty:Number(tr.querySelector('.qty').value||1)}});if(!items.length||items.some(x=>!x.service)){alert('Please add at least one service and select a service for each line.');return}const rec={id:nextId('Q'),type:'quotation',lab:state.lab,created:new Date().toISOString(),date:fd.get('date'),company:fd.get('company'),address:fd.get('address'),contact:fd.get('contact'),email:fd.get('email'),addressee:fd.get('addressee'),tat:fd.get('tat'),schedule:fd.get('schedule'),sampleReq:fd.get('sampleReq'),payment:fd.get('payment'),items};save(rec);showQuotation(rec)}
function nextId(prefix){const key='dostSeq_'+prefix+'_'+new Date().getFullYear();let n=Number(localStorage.getItem(key)||0)+1;localStorage.setItem(key,n);return `${prefix}-${LABS[state.lab].code}-${new Date().getFullYear()}-${String(n).padStart(3,'0')}`}
function records(){return JSON.parse(localStorage.getItem('dostRecords')||'[]')}
function save(r){const a=records();a.unshift(r);localStorage.setItem('dostRecords',JSON.stringify(a))}
function searchRecords(){document.getElementById('main').innerHTML=`<div class="toolbar"><button class="btn" onclick="chooseExisting('${state.mode}')">← Back</button></div><div class="panel"><h2>Search Existing ${state.mode==='quotation'?'Quotations':'Reservations'}</h2><div class="searchbar"><input id="searchInput" placeholder="Search by company, number or date" oninput="renderResults()"><button class="btn primary" onclick="renderResults()">Search</button></div><div id="results" style="margin-top:18px"></div></div>`;renderResults()}
function renderResults(){const q=(document.getElementById('searchInput')?.value||'').toLowerCase();const a=records().filter(r=>r.type===state.mode&&r.lab===state.lab&&JSON.stringify(r).toLowerCase().includes(q));document.getElementById('results').innerHTML=a.length?a.map(r=>`<div class="card" style="margin-bottom:10px;cursor:default"><strong>${esc(r.id)}</strong><div>${esc(r.company||'')}</div><small>${new Date(r.created).toLocaleString()} · ${LABS[r.lab].name}</small><div style="margin-top:10px"><button class="btn secondary" onclick="openRecord('${r.id}')">View / Print</button></div></div>`).join(''):`<p style="color:var(--muted)">No saved records found.</p>`}
function openRecord(id){const r=records().find(x=>x.id===id);r.type==='quotation'?showQuotation(r):showReservation(r)}
function reservationForm(){const tanker=state.lab==='RML';document.getElementById('main').innerHTML=`<div class="toolbar"><button class="btn" onclick="chooseExisting('reservation')">← Back</button></div><div class="panel"><h2>Reservation Form</h2>${tanker?'<div class="notice">Regional Metrology Laboratory reservation prototype based on the uploaded tanker calibration reservation/conforme form.</div>':''}<form id="resForm"><div class="section-title">Client / Sample Information</div><div class="form-grid">${field('Name of Company','company','text','required')}${field('Address','address','text','required')}${field('Sample Submitted','sample','text','required')}${field('Capacity','capacity','text')}${field('Plate No.','plate','text')}${field('Preferred Date','date','date','required')}${field('Preferred Time','time','time')}${field('Contact No.','contact','text')}${field('Email Address','email','email')}</div><div class="section-title">Additional Information</div><div class="form-grid">${field('Special Requirements / Remarks','remarks')}</div><div class="toolbar" style="margin-top:20px"><button type="button" class="btn primary" onclick="generateReservation()">Generate Reservation</button></div></form></div>`}
function generateReservation(){const f=document.getElementById('resForm');if(!f.reportValidity())return;const fd=new FormData(f);const r={id:nextId('RF'),type:'reservation',lab:state.lab,created:new Date().toISOString(),company:fd.get('company'),address:fd.get('address'),sample:fd.get('sample'),capacity:fd.get('capacity'),plate:fd.get('plate'),date:fd.get('date'),time:fd.get('time'),contact:fd.get('contact'),email:fd.get('email'),remarks:fd.get('remarks')};save(r);showReservation(r)}
function showQuotation(r){const total=r.items.reduce((s,x)=>s+x.fee*x.qty,0),halal=r.lab==='Halal';document.getElementById('modalContent').innerHTML=`<div class="print-doc"><div class="no-print" style="display:flex;gap:8px;justify-content:flex-end;margin-bottom:15px"><button class="btn primary" onclick="window.print()">Print / Save PDF</button></div><div style="text-align:center;font-size:11px">Republic of the Philippines<br><b>DEPARTMENT OF SCIENCE AND TECHNOLOGY</b><br>Davao Region<br><b>REGIONAL STANDARDS AND TESTING LABORATORY - DAVAO</b></div><div class="doc-title">QUOTATION</div><table class="doc-table"><tr><td><b>QUOTATION NUMBER</b><br>${esc(r.id)}</td><td><b>Date Issued:</b><br>${esc(r.date)}</td></tr><tr><td colspan="2"><b>TO:</b> ${esc(r.company)}<br>${esc(r.address)}<br>Contact: ${esc(r.contact)}<br>Email: ${esc(r.email)}<br>Addressee/Designation: ${esc(r.addressee)}</td></tr></table><p>${halal?'Please find below the quotation of the following items:':'QUOTATION DETAILS'}</p><table class="doc-table"><thead><tr><th>No.</th><th>Item / Sample Description</th><th>Test / Service</th><th>Requirement / Method</th><th>Unit Fee</th><th>Qty</th><th>Total Amount</th></tr></thead><tbody>${r.items.map((x,i)=>`<tr><td>${i+1}</td><td>${esc(x.description)}</td><td>${esc(x.service)}</td><td>${esc(x.requirement)}</td><td>${peso(x.fee)}</td><td>${x.qty}</td><td>${peso(x.fee*x.qty)}</td></tr>`).join('')}</tbody></table><div class="doc-total">GRAND TOTAL: ${peso(total)}</div>${halal?'<p class="doc-small">NOTE: This quotation is valid five (5) working days upon receipt.</p>':`<p class="doc-small"><b>SERVICE INFORMATION AND REQUIREMENTS</b><br>Estimated Turnaround Time (TAT): ${esc(r.tat)} working days<br>Sample Requirement: ${esc(r.sampleReq)}<br>Sample Submission Schedule: ${esc(r.schedule)}<br>Payment Terms / Instructions: ${esc(r.payment)}</p><p class="doc-small"><b>TERMS AND CONDITIONS</b><br>THE REQUESTING PARTY shall provide complete and accurate information necessary for the requested services; submit compliant samples/items; secure and observe a confirmed sample submission schedule; review and confirm the Request Form details; and settle applicable fees as required.</p>`}<div class="doc-sign"><div>Prepared by:<div class="doc-line"></div></div><div>Reviewed & Approved by:<div class="doc-line"></div></div></div><div style="margin-top:25px">Received and Conformed by:<div class="doc-line"></div><div class="doc-small">Customer's Name & Signature / Date</div></div><p class="doc-small" style="margin-top:25px">Prototype generated from the uploaded DOST RSTL quotation template. Record No.: ${esc(r.id)}</p></div>`;document.getElementById('modal').style.display='flex'}
function showReservation(r){document.getElementById('modalContent').innerHTML=`<div class="print-doc"><div class="no-print" style="display:flex;gap:8px;justify-content:flex-end;margin-bottom:15px"><button class="btn primary" onclick="window.print()">Print / Save PDF</button></div><div style="text-align:center;font-size:11px">Republic of the Philippines<br><b>DEPARTMENT OF SCIENCE AND TECHNOLOGY</b><br>Davao Region<br><b>Regional Standards and Testing Laboratory – Davao</b></div><div class="doc-title">R E S E R V A T I O N &nbsp; F O R M</div><table class="doc-table"><tr><td><b>CONFORME LETTER NO.:</b><br>${esc(r.id)}</td><td><b>Date:</b><br>${esc(r.date)}</td></tr><tr><td colspan="2"><b>TO Name of Company:</b> ${esc(r.company)}<br><b>Address:</b> ${esc(r.address)}<br><b>Sample Submitted:</b> ${esc(r.sample)}<br><b>Capacity:</b> ${esc(r.capacity)}<br><b>Plate No.:</b> ${esc(r.plate)}</td></tr></table><p><b>Reservation Details</b><br>Scheduled date: ${esc(r.date)}<br>Preferred time: ${esc(r.time)}<br>Contact No.: ${esc(r.contact)}<br>Email: ${esc(r.email)}<br>Remarks: ${esc(r.remarks)}</p><p class="doc-small">The reservation is subject to laboratory confirmation and applicable requirements. For tanker calibration, the official conditions in the laboratory reservation/conforme form remain applicable.</p><div class="doc-sign"><div>Prepared By:<div class="doc-line"></div>Laboratory Analyst</div><div>Reviewed and Approved By:<div class="doc-line"></div>Technical Manager</div></div><div style="margin-top:25px">Received By / CONFORME:<div class="doc-line"></div><div class="doc-small">Name of Customer / Position</div></div></div>`;document.getElementById('modal').style.display='flex'}
function closeModal(){document.getElementById('modal').style.display='none'}
render();
</script></body></html>
